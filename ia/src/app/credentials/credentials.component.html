<div class="detect-container">
  <h1>Detectando base de datos_________________________</h1>

  <form [formGroup]="typeDbform">
    <div class="select-container">
      <label for="type">Seleccionar motor de base de datos</label>
      <select name="type" id="type" formControlName="type">
        <option value="mysql">mysql</option>
      </select>
    </div>
    <div class="version-container">
      <div class="select-container">
        <label for="version">Seleccionar Versión de la app</label>
        <select name="version" id="version">
          <option value="1">V 1</option>
        </select>
      </div>
      <button (click)="showForm()">Seleccionar</button>
    </div>
  </form>

  <div *ngIf="show" class="form-container">
    <h2>Credenciales de acceso</h2>
    <form [formGroup]="form">
      <div class="input-contiainer">
        <label for="user">Usuario: </label>
        <input id="user" type="text" formControlName="user" />
      </div>
      <div class="input-contiainer">
        <label for="password">Contraseña: </label>
        <input id="password" type="password" formControlName="password" />
      </div>
      <div class="input-contiainer">
        <label for="host">Host: </label>
        <input id="host" type="text" formControlName="host" />
      </div>
      <div class="input-button">
        <div class="input-contiainer">
          <label for="db">Base de datos: </label>
          <input id="db" type="text" formControlName="db" />
        </div>
        <button (click)="handleSubmit($event)">Probar conexión</button>
      </div>
    </form>
  </div>
  <div class="state-container">
    <h2>Estado_________________________________</h2>
    <span [ngClass]="{ 'text-green': successDB, 'text-red': messageInfo == 'Error en la conexión.' }">{{ messageInfo }}</span>
    <div
      [ngClass]="{ percent50: show, percent100: successDB }"
      class="state"
    ></div>
  </div>
</div>
