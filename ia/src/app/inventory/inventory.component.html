<div class="inventory-container">
  <div class="container">
    <h1>Módulo de Gestión de Inventarios</h1>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nit</th>
            <th>Descripción del producto</th>
            <th>En Stock</th>
            <th>Costo*Unidad</th>
            <th>Ganancia*Unidad</th>
            <th>Fecha</th>
            <th>Proveedor</th>
            <th>
              <input
                type="text"
                placeholder="Buscar"
                [(ngModel)]="searchTerm"
                (input)="searchProducts()"
                name="buscar"
              />
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let in of filteredInventory">
            <td>{{ in.nit }}</td>
            <td>{{ in.descripcion }}</td>
            <td>
              <input
              class="stock_edit"
                type="number"
                [(ngModel)]="in.cantidad_stock"
                (blur)="updateStock(in)"
                min="0"
              />
            </td>
            <td>{{ in.costo_unidad }}</td>
            <td>{{ in.ganancia_unidad }}</td>
            <td>{{ in.fecha | date }}</td>
            <td>{{ in.proveedor }}</td>
            <td><a href="">Preguntar</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="btn-container" (click)="addProduct()">
    <button>Agregar entrada</button>
  </div>
</div>
<app-modal [visible]="modal" title="Subir articulo" (closed)="modal = false">
  <form action="">
    <div class="inputs">
      <label for="">NIT:</label>
      <input type="text" [(ngModel)]="nit" name="nit"  placeholder="Ejemplo: 18888888-9" />
    </div>
    <div class="inputs">
      <label for="">Descripción del producto:</label>
      <input type="text" [(ngModel)]="descripcion" name="descripcion" placeholder="Describa el producto" />
    </div>
    <div class="inputs">
      <label for="">Cantidad de Stock:</label>
      <input type="text" [(ngModel)]="stock" name="stock"  placeholder="¿Cuantos productos hay?"/>
    </div>
    <div class="inputs">
      <label for="">Costo de Unidad:</label>
      <input type="text" [(ngModel)]="valor" name="valor" placeholder="Valor del producto" />
    </div>
    <div class="inputs">
      <label for="">Ganancia por Unidad:</label>
      <input type="text" [(ngModel)]="gain" name="gain" placeholder="Ganancia del producto"/>
    </div>
    <div class="inputs">
      <label for="">Proveedor:</label>
      <input type="text" [(ngModel)]="provider" name="provider" placeholder="Proveedor del prodcuto" />
    </div>
    <div class="btn-container" (click)="sendProduct($event)">
      <button type="submit">Enviar</button>
    </div>
  </form>
</app-modal>
